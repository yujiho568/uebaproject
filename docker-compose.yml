# docker-compose.yml
# Docker Compose v2 호환 버전 (version 제거)

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: ueba_postgres
    environment:
      POSTGRES_DB: ueba_system
      POSTGRES_USER: ueba_user
      POSTGRES_PASSWORD: ueba_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ueba_user -d ueba_system"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ueba-network

  # Redis for caching and message queuing
  redis:
    image: redis:7-alpine
    container_name: ueba_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - ueba-network

  # UEBA FastAPI Backend
  ueba-api:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    working_dir: /app
    build: .
    container_name: ueba_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://ueba_user:ueba_password@postgres:5432/ueba_system
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=dev-secret-key-change-in-production-environment
      - DEBUG=true
      - AWS_REGION=ap-northeast-2
      - CORS_ORIGINS=http://localhost:3000,http://localhost:8080
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./profiles:/app/profiles
      - .:/app  # 개발용 - 코드 변경사항 실시간 반영
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ueba-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # pgAdmin for database management (개발용)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ueba_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ueba.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - ueba-network
    profiles:
      - dev

  # Redis Commander for Redis management (개발용)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: ueba_redis_commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - ueba-network
    profiles:
      - dev

  # nginx reverse proxy (운영용)
  nginx:
    image: nginx:alpine
    container_name: ueba_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - ueba-api
    restart: unless-stopped
    networks:
      - ueba-network
    profiles:
      - production

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  ueba-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
